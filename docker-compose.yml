name: fitflare
services:
  fitflare:
    build: .
    image: ${FITFLARE_IMAGE:-fitflare:latest}
    container_name: fitflare-app
    # On Linux bind mounts, prefer running as the host user to avoid write failures
    user: "${FITFLARE_UID:-10001}:${FITFLARE_GID:-10001}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    ports:
      - "${FITFLARE_BIND_HOST:-127.0.0.1}:${FITFLARE_PORT:-9000}:9000"   # Reverse proxy only
      # - "${FITFLARE_CALLBACK_BIND_HOST:-0.0.0.0}:8080:8080" # Optional: local HTTPS callback port for background OAuth
    volumes:
      # Mount data directories to persist data
      - ./profiles:/app/profiles
    environment:
      - PYTHONIOENCODING=utf-8
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=${TZ:-Etc/UTC}
      - GOOGLE_HEALTH_CLIENT_ID=${GOOGLE_HEALTH_CLIENT_ID:-}
      - GOOGLE_HEALTH_CLIENT_SECRET=${GOOGLE_HEALTH_CLIENT_SECRET:-}
      - GOOGLE_HEALTH_REDIRECT_URI=${GOOGLE_HEALTH_REDIRECT_URI:-}
      - FITBIT_REDIRECT_URI=${FITBIT_REDIRECT_URI:-http://localhost:8080/callback}
      - FITBIT_CLIENT_ID=${FITBIT_CLIENT_ID:-}
      - FITBIT_CLIENT_SECRET=${FITBIT_CLIENT_SECRET:-}
      - FITBIT_SSL_CERT=${FITBIT_SSL_CERT:-}
      - FITBIT_SSL_KEY=${FITBIT_SSL_KEY:-}
      - FITBIT_AUTH_TIMEOUT=${FITBIT_AUTH_TIMEOUT:-60}
      - FITBIT_FALLBACK_REDIRECT=${FITBIT_FALLBACK_REDIRECT:-}
      - FITFLARE_AUTO_SYNC_ENABLED=${FITFLARE_AUTO_SYNC_ENABLED:-true}
      - FITFLARE_AUTO_SYNC_INTERVAL_SECONDS=${FITFLARE_AUTO_SYNC_INTERVAL_SECONDS:-21600}
      - FITFLARE_AUTO_SYNC_SCAN_INTERVAL_SECONDS=${FITFLARE_AUTO_SYNC_SCAN_INTERVAL_SECONDS:-300}
      - FITFLARE_ADMIN_PASSWORD=${FITFLARE_ADMIN_PASSWORD:-}
      - FITFLARE_ADMIN_PASSWORD_HASH=${FITFLARE_ADMIN_PASSWORD_HASH:-}
      - FITFLARE_SESSION_SECRET=${FITFLARE_SESSION_SECRET:-}
      - FITFLARE_SESSION_SECRET_FILE=${FITFLARE_SESSION_SECRET_FILE:-}
      - FITFLARE_PROFILE_ID=${FITFLARE_PROFILE_ID:-me}
      - FITFLARE_DATA_ACCESS=${FITFLARE_DATA_ACCESS:-private}
      - FITFLARE_PUBLIC_PROFILES=${FITFLARE_PUBLIC_PROFILES-*}
      - FITFLARE_SESSION_COOKIE_SECURE=${FITFLARE_SESSION_COOKIE_SECURE:-true}
    # volumes:
    #   - ./certs:/certs:ro   # If using background OAuth with local HTTPS
    restart: unless-stopped
    # Remove stdin_open and tty for production
    # To access the container for setup, use: docker exec -it fitflare-app bash
